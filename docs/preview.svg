<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Burn Rate: an amber LED board reading one thousand two hundred forty dollars and fifty cents burned so far.">
  <defs>
    <radialGradient id="pool" cx="50%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="72%" stop-color="#0a0a0d"/>
    </radialGradient>
    <radialGradient id="amberPool" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="#000" fill-opacity="0"/>
      <rect y="2" width="1" height="1" fill="#000" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#pool)"/>
  <rect width="1200" height="630" fill="url(#amberPool)"/>

  <!-- Panel -->
  <rect x="80" y="70" width="1040" height="490" rx="4" fill="#141419" stroke="#1c1c22" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="120" y="150" font-family="'Courier New', ui-monospace, monospace" font-size="46" font-weight="700" letter-spacing="4" fill="#f5ede0">
    <tspan fill="#ffb000" filter="url(#glow)">$</tspan><tspan dx="10">BURN RATE</tspan>
  </text>

  <!-- The ticker -->
  <text x="600" y="360" text-anchor="middle" font-family="'Courier New', ui-monospace, monospace" font-size="150" font-weight="700" fill="#ffb000" filter="url(#glow)">$1,240.50</text>

  <!-- Readouts -->
  <g font-family="'Courier New', ui-monospace, monospace">
    <text x="360" y="470" text-anchor="middle" font-size="20" letter-spacing="3" fill="#8a8a94">COST / MIN</text>
    <text x="360" y="512" text-anchor="middle" font-size="40" fill="#f5ede0">$600.00</text>
    <text x="840" y="470" text-anchor="middle" font-size="20" letter-spacing="3" fill="#8a8a94">ELAPSED</text>
    <text x="840" y="512" text-anchor="middle" font-size="40" fill="#f5ede0">2:04</text>
  </g>

  <!-- Scanline overlay -->
  <rect width="1200" height="630" fill="url(#scan)"/>
</svg>
