<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta
      name="description"
      content="A real-time dollar counter for meetings — screen-share it and watch the room's cost climb live."
    />
    <title>Burn Rate — watch the meeting's cost climb live</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0d'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='700' fill='%23ffb000' text-anchor='middle'%3E%24%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="room">
      <header class="wordmark" aria-hidden="false">
        <span class="wordmark__glyph">$</span>Burn&nbsp;Rate
      </header>

      <section class="ticker" id="ticker" aria-live="off">
        <p class="ticker__digits" id="ticker-digits">$0.00</p>
      </section>

      <p class="tagline">Scaffold in progress — the live counter lands in the next build.</p>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
