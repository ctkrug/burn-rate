<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta
      name="description"
      content="A real-time dollar counter for meetings — screen-share it and watch the room's cost climb live."
    />
    <title>Burn Rate — watch the meeting's cost climb live</title>

    <!-- Social preview: this app is built to be pasted into chat / screen-shares,
         so links should render with a real title + blurb, not a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Burn Rate — watch the meeting's cost climb live" />
    <meta
      property="og:description"
      content="Enter the room's headcount and average salary, hit start, and watch the meeting's cost tick up live."
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Burn Rate — watch the meeting's cost climb live"
    />
    <meta
      name="twitter:description"
      content="A live, screen-shareable dollar counter for meetings."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0d'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='700' fill='%23ffb000' text-anchor='middle'%3E%24%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="room" id="room">
      <header class="wordmark">
        <span class="wordmark__glyph">$</span
        ><span class="wordmark__text">Burn&nbsp;Rate</span>
      </header>

      <form class="setup" id="setup" novalidate>
        <div class="field">
          <label class="field__label" for="headcount">People in the room</label>
          <input
            class="field__input"
            id="headcount"
            name="headcount"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="10"
            aria-describedby="headcount-error"
          />
          <p class="field__error" id="headcount-error" role="alert"></p>
        </div>

        <div class="field">
          <label class="field__label" for="salary">Average salary / yr</label>
          <input
            class="field__input"
            id="salary"
            name="salary"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="$120,000"
            aria-describedby="salary-error"
          />
          <p class="field__error" id="salary-error" role="alert"></p>
        </div>

        <div class="presets" id="presets" aria-label="Quick-fill presets"></div>
      </form>

      <section class="ticker" id="ticker" aria-label="Meeting cost so far">
        <p class="ticker__digits" id="ticker-digits">$0.00</p>
      </section>

      <div class="readouts" id="readouts">
        <span class="readout">
          <span class="readout__label">cost / min</span>
          <b class="readout__value" id="cost-per-min">$0.00</b>
        </span>
        <span class="readout">
          <span class="readout__label">elapsed</span>
          <b class="readout__value" id="elapsed">0:00</b>
        </span>
      </div>

      <div class="controls" id="controls">
        <button class="btn btn--primary" id="start" type="button">Start</button>
        <button class="btn" id="pause" type="button" hidden>Pause</button>
        <button class="btn" id="reset" type="button" hidden>Reset</button>
        <button class="btn" id="copy-link" type="button" hidden>
          Copy&nbsp;Link
        </button>
        <button class="btn btn--icon" id="present" type="button" hidden>
          Presenter
        </button>
        <button
          class="btn btn--icon"
          id="mute"
          type="button"
          aria-pressed="false"
          aria-label="Mute sound"
        >
          <span aria-hidden="true" id="mute-glyph">♪</span>
        </button>
      </div>

      <button class="exit-present" id="exit-present" type="button" hidden>
        Exit presenter (Esc)
      </button>

      <p class="sr-only" id="live" aria-live="polite"></p>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
